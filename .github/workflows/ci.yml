name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to reviewed commit SHAs so a repointed upstream tag can't change the
      # code this workflow executes; the trailing comment records the tag each SHA was reviewed at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm exec prettier --check .
      - run: pnpm test

  publish:
    # Only a version tag publishes, and only once every check above has passed for that commit.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

      # npm's trusted publishing trades this workflow's OIDC token for a one-time publish credential, so no npm
      # token is stored anywhere, and the release carries provenance linking it to this commit and workflow. The trusted
      # publisher on npmjs.com names this repository and this file, so renaming the workflow stops releases until the
      # publisher is updated to match.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # `npm stage` needs npm 11.15.0 or later, which not every Node 24 release bundles.
      - run: npm install --global npm@^11.15.0

      # Staging uploads the release without making it installable: it goes live only once a maintainer approves it on
      # npmjs.com (Staged Packages) or with `npm stage approve <stage-id>`, both behind two-factor authentication, which
      # this workflow's token can't do. The trusted publisher permits staging only, so a plain `npm publish` is refused.
      - run: npm stage publish --provenance
