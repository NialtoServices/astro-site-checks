name: Verify

# Runs every check the site defines, so a push cannot land in a state a local run would have caught.
# Cloudflare builds and deploys the site separately; this only checks. The file is identical in every
# Nialto site: a script a site does not define is skipped, so each runs whichever checks it has.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the checkout; the default token would otherwise give every action in it whatever
# the repository's default permissions are.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Builds refuse to run without these. The job throws its build away, so the origin only shapes
      # URLs nobody sees, and Turnstile's documented test key always passes, so no real key is needed.
      ASTRO_SITE: https://example.com/
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

    steps:
      # Actions are pinned to commit SHAs, with the tag each was reviewed at alongside, so a tag moved
      # upstream (or by whoever takes over an account) cannot change what runs here without a diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm's version comes from package.json's `packageManager` and Node's from .nvmrc, so CI runs
      # what a developer and the Cloudflare build run rather than whatever the runner ships.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Not --ignore-scripts: postinstall generates worker-configuration.d.ts, which `astro check` needs.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run --if-present check

      - run: pnpm run --if-present format:check

      - run: pnpm run --if-present lint:style

      - run: pnpm run --if-present test

      - run: pnpm run --if-present build

      # These read dist/, so they follow the build rather than running beside it.
      - run: pnpm run --if-present lint:links

      - run: pnpm run --if-present lint:css-scope

      - run: pnpm run --if-present lint:redirects

      - run: pnpm run --if-present lint:headers

      - name: Check for dependency advisories
        # Reported rather than fatal: an advisory in a transitive build dependency is not a reason to
        # block a content change.
        continue-on-error: true
        run: pnpm audit
